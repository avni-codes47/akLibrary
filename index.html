// ---------- DB access ----------
function loadDB(){
  let raw = localStorage.getItem(DB_KEY);
  if(!raw){ const d = seed(); localStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }
  try{ return JSON.parse(raw); }catch(e){ const d = seed(); localStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }
}
let DB = loadDB();
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  if(supabaseReady) queueSupabaseSync();
}
function queueSupabaseSync(){
  const snapshot = JSON.parse(JSON.stringify(DB));
  supabaseSyncQueue = supabaseSyncQueue.then(async()=>{
    const books = snapshot.books.filter(x=>UUID_RE.test(x.id));
    const students = snapshot.users.filter(x=>x.role==='student' && UUID_RE.test(x.id));
    const issues = snapshot.issues.filter(x=>UUID_RE.test(x.id));
    const bookRows = books.map(b=>({id:b.id,title:b.title,author:b.author,isbn:b.isbn||null,category:b.category||null,quantity:Number(b.total)||0,available_quantity:Number(b.available)||0}));
    const studentRows = students.map(u=>({id:u.id,name:u.name,email:u.email,student_id:u.enrollment||null}));
    const issueRows = issues.map(i=>({id:i.id,book_id:i.bookId,student_id:i.userId,issue_date:new Date(i.issueDate).toISOString(),due_date:new Date(i.dueDate).toISOString(),return_date:i.returnDate?new Date(i.returnDate).toISOString():null,status:i.status,fine:Number(i.fine)||0}));
    for(const [table, rows, key] of [['books',bookRows,'books'],['students',studentRows,'students'],['book_issues',issueRows,'issues']]){
      if(rows.length){ const {error}=await supabaseClient.from(table).upsert(rows,{onConflict:'id'}); if(error) throw new Error(table+': '+error.message); }
      const current = new Set(rows.map(r=>r.id));
      const removed = [...syncedIds[key]].filter(id=>!current.has(id));
      if(removed.length){ const {error}=await supabaseClient.from(table).delete().in('id',removed); if(error) throw new Error(table+' delete: '+error.message); }
      syncedIds[key]=current;
    }
  }).catch(err=>{ console.error('Supabase sync failed:',err); toast('Supabase sync failed: '+err.message,'error'); });
  return supabaseSyncQueue;
}
async function loadSupabaseData(){
  const [booksRes, studentsRes, issuesRes] = await Promise.all([
    supabaseClient.from('books').select('id,title,author,isbn,category,quantity,available_quantity,created_at'),
    supabaseClient.from('students').select('id,name,email,student_id,created_at'),
    supabaseClient.from('book_issues').select('id,book_id,student_id,issue_date,due_date,return_date,status,fine')
  ]);
  for(const [name,res] of [['books',booksRes],['students',studentsRes],['book_issues',issuesRes]]) if(res.error) throw new Error(name+': '+res.error.message);
  let bookSource=booksRes.data||[];
  if(bookSource.length===0){
    const demoRows=DB.books.map(b=>({id:newId(),title:b.title,author:b.author,isbn:b.isbn,category:b.category,quantity:b.total,available_quantity:b.available}));
    const {data:inserted,error:seedError}=await supabaseClient.from('books').insert(demoRows).select('id,title,author,isbn,category,quantity,available_quantity,created_at');
    if(seedError) throw new Error('books initial setup: '+seedError.message);
    bookSource=inserted||[];
  }
  const remoteBooks=bookSource.map((b,i)=>({id:b.id,title:b.title,author:b.author||'Unknown',category:b.category||'General',isbn:b.isbn||'',publisher:'',year:2020,total:Number(b.quantity)||0,available:Number(b.available_quantity)||0,floor:'',section:b.category||'',rack:'',shelf:'',color:['4169e1','2b55d6','7c3aed','0ea5e9'][i%4],popularity:0,added:b.created_at?new Date(b.created_at).getTime():Date.now()}));
  const remoteStudents=(studentsRes.data||[]).map(u=>({id:u.id,role:'student',name:u.name,email:u.email,enrollment:u.student_id||'',phone:'',dept:'',created:u.created_at?new Date(u.created_at).getTime():Date.now()}));
  const remoteIssues=(issuesRes.data||[]).map(i=>({id:i.id,bookId:i.book_id,userId:i.student_id,issueDate:new Date(i.issue_date).getTime(),dueDate:new Date(i.due_date).getTime(),returnDate:i.return_date?new Date(i.return_date).getTime():null,status:i.status,fine:Number(i.fine)||0,renewRequested:false}));
  DB.books=remoteBooks;
  DB.users=[...DB.users.filter(u=>u.role==='admin'),...remoteStudents];
  DB.issues=remoteIssues;
  syncedIds.books=new Set(remoteBooks.map(x=>x.id)); syncedIds.students=new Set(remoteStudents.map(x=>x.id)); syncedIds.issues=new Set(remoteIssues.map(x=>x.id));
  localStorage.setItem(DB_KEY,JSON.stringify(DB));
  supabaseReady=true;
}
function uid(p){ DB._seq=(DB._seq||100)+1; return p+DB._seq; }

// ---------- Session ----------
function getSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null} }
function setSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

// ---------- Helpers ----------
const day=86400000;
function fmtDate(t){ if(!t) return '—'; return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) }
function fmtTime(t){ return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) }
function daysLeft(t){ return Math.ceil((t-Date.now())/day) }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function book(id){ return DB.books.find(b=>b.id===id) }
function user(id){ return DB.users.find(u=>u.id===id) }

function addLog(text){ DB.logs.unshift({id:uid('l'),text,time:Date.now()}); saveDB(); }
function notify(userId,type,text){ DB.notifications.unshift({id:uid('n'),userId,type,text,time:Date.now(),read:false}); saveDB(); }

// ---------- Toast ----------
function toast(msg,type='success'){
  const colors={success:'bg-emerald-600',error:'bg-rose-600',info:'bg-royal'};
  const icons={success:'✓',error:'✕',info:'ℹ'};
  const el=document.createElement('div');
  el.className=`toast ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm font-medium max-w-xs`;
  el.innerHTML=`<span class="font-bold">${icons[type]}</span><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},2800);
}

// ---------- Book cover SVG ----------
function coverHTML(b, cls='h-40'){
  const initials = b.title.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return `<div class="book-cover relative ${cls} w-full rounded-lg overflow-hidden flex items-end"
    style="background:linear-gradient(140deg,#${b.color} 0%, #0b1f4d 130%)">
    <div class="absolute top-2 left-2 text-white/30 text-3xl font-black">${esc(initials)}</div>
    <div class="absolute inset-x-0 bottom-0 h-1.5 bg-white/20"></div>
    <div class="p-2.5 text-white relative z-10">
      <div class="text-[11px] font-semibold leading-tight line-clamp-2">${esc(b.title)}</div>
      <div class="text-[9px] opacity-70 mt-0.5">${esc(b.author)}</div>
    </div>
  </div>`;
}

}

function bindWelcome(){
  document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{authMode=b.dataset.auth; document.getElementById('authPanel').innerHTML=authPanel(); document.getElementById('authPanel').classList.add('fade-in'); bindWelcome();});
  const lf=document.getElementById('loginForm');
  if(lf) lf.onsubmit=async e=>{e.preventDefault();
    const f=new FormData(lf); const email=f.get('email').trim().toLowerCase(); const role=f.get('role');
    if(role==='admin'){
      const u=DB.users.find(x=>x.email.toLowerCase()===email && x.role==='admin');
      if(!u||u.pass!==hash(f.get('pass'))){toast('Invalid admin credentials','error');return;}
      setSession({id:u.id,role:'admin'}); addLog(`${u.name} (admin) logged in`); toast('Welcome, '+u.name.split(' ')[0]+'!'); STATE.sub='dashboard'; render(); return;
    }
    const {error}=await supabaseClient.auth.signInWithPassword({email,password:f.get('pass')});
    if(error){toast(error.message,'error');return;}
    const {data:profile,error:profileError}=await supabaseClient.from('students').select('id,name,email,student_id,created_at').eq('email',email).maybeSingle();
    if(profileError||!profile){await supabaseClient.auth.signOut();toast(profileError?.message||'Student profile not found in students table','error');return;}
    const u={id:profile.id,role:'student',name:profile.name,email:profile.email,enrollment:profile.student_id||'',phone:'',dept:'',created:profile.created_at?new Date(profile.created_at).getTime():Date.now()};
    DB.users=DB.users.filter(x=>x.id!==u.id); DB.users.push(u); localStorage.setItem(DB_KEY,JSON.stringify(DB));
    setSession({id:u.id,role:'student'}); toast('Welcome, '+u.name.split(' ')[0]+'!'); STATE.sub='dashboard'; render();
  };
  const rf=document.getElementById('regForm');
  if(rf) rf.onsubmit=async e=>{e.preventDefault(); const f=new FormData(rf);
    if(f.get('pass')!==f.get('pass2')){toast('Passwords do not match','error');return;}
    const email=f.get('email').trim().toLowerCase();
    if(DB.users.some(u=>u.email.toLowerCase()===email)){toast('Email already registered','error');return;}
    if(DB.users.some(u=>u.enrollment===f.get('enrollment'))){toast('Enrollment number exists','error');return;}
    const {data,error}=await supabaseClient.auth.signUp({email,password:f.get('pass'),options:{data:{name:f.get('name'),student_id:f.get('enrollment')}}});
    if(error){toast(error.message,'error');return;}
    if(!data.user){toast('Could not create account. Please try again.','error');return;}
    const studentId=data.user.id;
    const {error:insertError}=await supabaseClient.from('students').insert({id:studentId,name:f.get('name'),email,student_id:f.get('enrollment')});
    if(insertError){toast('Account created, but student profile could not be saved: '+insertError.message,'error');return;}
    const nu={id:studentId,role:'student',name:f.get('name'),email,enrollment:f.get('enrollment'),phone:f.get('phone'),dept:f.get('dept'),created:Date.now()};
    DB.users.push(nu); localStorage.setItem(DB_KEY,JSON.stringify(DB));
    if(data.session){setSession({id:nu.id,role:'student'});toast('Account created! Welcome 🎉');STATE.sub='dashboard';render();}
    else {toast('Account created. Check your email to confirm, then log in.','info');authMode='studentLogin';document.getElementById('authPanel').innerHTML=authPanel();bindWelcome();}
  };
  const ff=document.getElementById('forgotForm');
  if(ff) ff.onsubmit=async e=>{e.preventDefault(); const email=new FormData(ff).get('email').trim().toLowerCase(); const {error}=await supabaseClient.auth.resetPasswordForEmail(email); if(error){toast(error.message,'error');return;} toast('Password reset email sent.','info'); authMode='choice'; document.getElementById('authPanel').innerHTML=authPanel(); bindWelcome();};
}

function statCard(label,val,icon,color,sub){
  return `<div class="bg-white rounded-2xl p-5 card-shadow flex items-start gap-4 hover:-translate-y-0.5 transition">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center text-xl" style="background:${color}22;color:${color}">${icon}</div>

  </div>`;
}
function badge(text,color){const m={green:'bg-emerald-100 text-emerald-700',red:'bg-rose-100 text-rose-700',amber:'bg-amber-100 text-amber-700',blue:'bg-blue-100 text-blue-700',gray:'bg-slate-100 text-slate-600',violet:'bg-violet-100 text-violet-700'};return `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${m[color]||m.gray}">${text}</span>`}
function emptyState(icon,msg){return `<div class="text-center py-16 text-slate-400"><div class="text-5xl mb-3">${icon}</div><p class="text-sm">${msg}</p></div>`}

function adminStats(){
  const b=DB.books;
  return {
    totalCopies:b.reduce((s,x)=>s+x.total,0),
    titles:b.length,
    available:b.reduce((s,x)=>s+x.available,0),
    issued:DB.issues.filter(i=>i.status==='issued').length,
    students:DB.users.filter(u=>u.role==='student').length,
    overdue:DB.issues.filter(i=>i.status==='issued'&&i.dueDate<Date.now()).length,
    pendingRes:DB.reservations.filter(r=>r.status==='Pending').length,
    queries:DB.messages.filter(m=>m.from!=='u1'&&!m.read).length + DB.conversations.filter(c=>!c.resolved).length*0
  };
}
function adminContent(){
  switch(STATE.sub){
    case 'dashboard': return adminDashboard();
    case 'books': return adminBooks();
    case 'students': return adminStudents();
    case 'issue': return adminIssue();
    case 'reservations': return adminReservations();
    case 'chat': return adminChat();
    case 'analytics': return adminAnalytics();
    case 'settings': return adminSettings();
    default: return adminDashboard();
  }
}

      Object.assign(bk,{title:f.get('title'),author:f.get('author'),category:f.get('category'),isbn:f.get('isbn'),publisher:f.get('publisher'),year:+f.get('year'),total:+f.get('total'),available:Math.max(0,bk.available+diff),floor:f.get('floor'),section:f.get('section'),rack:f.get('rack'),shelf:f.get('shelf')});

function bindAdmin(){
  document.querySelectorAll('.sinp').forEach(i=>i.className='sinp mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm');
  // books
  const bs=document.getElementById('bookSearch'); if(bs){bs.oninput=()=>{STATE.param={q:bs.value}; const main=document.getElementById('main'); main.innerHTML=adminBooks(); bindAdmin(); const ns=document.getElementById('bookSearch'); ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length);};}
  document.getElementById('addBookBtn')&&(document.getElementById('addBookBtn').onclick=()=>bookFormModal());
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>bookFormModal(book(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{confirmModal('Delete this book?','This removes the title permanently.',()=>{DB.books=DB.books.filter(x=>x.id!==b.dataset.del); addLog('Deleted a book'); saveDB(); toast('Book deleted'); render();});});
  // students
  const ss=document.getElementById('stuSearch'); if(ss){ss.oninput=()=>{STATE.param={q:ss.value}; document.getElementById('main').innerHTML=adminStudents(); bindAdmin(); const ns=document.getElementById('stuSearch'); ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length);};}
  document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>studentHistoryModal(b.dataset.history));
  // issue/return
  document.getElementById('issueBtn')&&(document.getElementById('issueBtn').onclick=issueModal);
  document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{
    const i=DB.issues.find(x=>x.id===b.dataset.return); const bk=book(i.bookId);
    i.status='returned'; i.returnDate=Date.now(); bk.available=Math.min(bk.total,bk.available+1);
    notify(i.userId,'return',`“${bk.title}” returned successfully.`);
    addLog(`Returned “${bk.title}”`); saveDB(); toast('Book returned, inventory updated'); render();
  });
  document.querySelectorAll('[data-renew]').forEach(b=>b.onclick=()=>{
    const i=DB.issues.find(x=>x.id===b.dataset.renew); i.dueDate+=DB.settings.borrowDays*day; i.renewRequested=false;
    notify(i.userId,'renew',`Renewal approved. New due date ${fmtDate(i.dueDate)}.`);
    addLog('Approved renewal'); saveDB(); toast('Renewal approved'); render();
  });
  // reservations

      DB.announcements.unshift({id:uid('a'),title:f.get('title'),text:f.get('text'),time:Date.now()});
      DB.users.filter(u=>u.role==='student').forEach(u=>notify(u.id,'announcement',f.get('title')));
      saveDB(); closeModal(); toast('Announcement published'); render();};

function updateRes(id,status,msgPrefix){

let exploreFilter='all', exploreQ='';
function studentExplore(){
  let list=DB.books.slice();
  if(exploreQ) list=list.filter(b=>[b.title,b.author,b.isbn,b.category].join(' ').toLowerCase().includes(exploreQ.toLowerCase()));
  if(exploreFilter==='available') list=list.filter(b=>b.available>0);
  if(exploreFilter==='unavailable') list=list.filter(b=>b.available===0);
  if(exploreFilter==='recent') list=list.sort((a,b)=>b.added-a.added);
  if(exploreFilter==='popular') list=list.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
  const filters=[['all','All'],['available','Available'],['unavailable','Unavailable'],['recent','Recently Added'],['popular','Popular']];
  return `

        <div><div class="font-semibold text-navy">Library Help Desk</div><div class="text-[11px] text-emerald-500">● Online</div></div>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="chatScroll">
        ${msgs.length?msgs.map(m=>chatBubble(m,s.id)).join(''):`<div class="text-center text-slate-400 text-sm py-8">👋 Hi! Ask us anything about books, locations, due dates & more.</div>`}
      </div>
      <form id="stuChatForm" class="p-3 border-t border-slate-100 flex gap-2">
        <input name="text" placeholder="Type your question..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm" autocomplete="off">
        <button class="px-5 py-2.5 rounded-xl bg-royal text-white font-medium text-sm">Send</button>
      </form>
    </div>
  </div>`;
}

// FAQ assistant using real DB data
function faqAnswer(q){
  const ql=q.toLowerCase(); const s=getSession();
  if(ql.includes('timing')||ql.includes('hours')||ql.includes('open')) return `Our library is open ${DB.settings.openHours}, ${DB.settings.workingDays}. Closed: ${DB.settings.holidays}.`;
  if(ql.includes('due')){
    const act=DB.issues.filter(i=>i.userId===s.id&&i.status==='issued');
    if(!act.length) return "You have no books currently borrowed, so nothing is due. 📚";
    return "Your due dates:\n"+act.map(i=>`• “${book(i.bookId)?.title}” — ${fmtDate(i.dueDate)} (${daysLeft(i.dueDate)>=0?daysLeft(i.dueDate)+' days left':Math.abs(daysLeft(i.dueDate))+' days overdue'})`).join('\n');
  }
  if(ql.includes('renew')) return `You can request a renewal from “My Borrowed Books”. Renewals extend the loan by ${DB.settings.borrowDays} days once approved by a librarian.`;
  if(ql.includes('locat')||ql.includes('where')) return "To find a book's shelf location, open it from Explore Books. Each title shows Floor → Section → Rack → Shelf. Need a specific one? Just type the title!";
  if(ql.includes('available')||ql.includes('availab')) {
    const avail=DB.books.filter(b=>b.available>0).length;
    return `Right now ${avail} of ${DB.books.length} titles have copies available. Use Explore Books → filter “Available” to browse them.`;
  }
  // try matching a book title
  const matched=DB.books.find(b=>ql.includes(b.title.toLowerCase().split(':')[0].slice(0,10)));
  if(matched) return `“${matched.title}”: ${matched.available}/${matched.total} copies available. Location: ${matched.floor?`${matched.floor} → ${matched.section} → ${matched.rack} → ${matched.shelf}`:'not assigned'}.`;
  return null;
}

function studentNotif(){
  const s=getSession();
  const list=DB.notifications.filter(n=>n.userId===s.id).sort((a,b)=>b.time-a.time);
  DB.notifications.filter(n=>n.userId===s.id).forEach(n=>n.read=true); saveDB();
  const icons={due:'⏰',overdue:'🚨',reservation:'📌',issue:'📖',return:'↩️',message:'💬',announcement:'📢',renew:'↻'};
  return `<div class="max-w-2xl space-y-2">${list.length?list.map(n=>`
    <div class="bg-white rounded-xl card-shadow p-4 flex items-start gap-3">
      <div class="w-9 h-9 rounded-lg bg-lavender flex items-center justify-center">${icons[n.type]||'🔔'}</div>
      <div class="flex-1"><div class="text-sm text-slate-700">${esc(n.text)}</div><div class="text-[11px] text-slate-400 mt-1">${fmtTime(n.time)} · ${fmtDate(n.time)}</div></div>
    </div>`).join(''):emptyState('🔔','No notifications yet')}</div>`;
}

      <div class="flex gap-2 justify-center mt-2">${badge(u.dept||'—','violet')}${badge('Active Member','green')}</div>

    </div>
    <div class="lg:col-span-2 bg-white rounded-2xl card-shadow p-6">
      <h3 class="font-bold text-navy mb-4">Edit Profile</h3>
      <form id="profileForm" class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label class="text-xs font-medium text-slate-600">Full Name</label><input name="name" value="${esc(u.name)}" class="pinp"></div>
        <div><label class="text-xs font-medium text-slate-600">Email</label><input name="email" value="${esc(u.email)}" class="pinp"></div>
        <div><label class="text-xs font-medium text-slate-600">Phone</label><input name="phone" value="${esc(u.phone||'')}" class="pinp"></div>
        <div><label class="text-xs font-medium text-slate-600">Enrollment</label><input value="${esc(u.enrollment)}" disabled class="pinp opacity-60"></div>
        <div><label class="text-xs font-medium text-slate-600">Department</label>
          <select name="dept" class="pinp"><option ${u.dept==='Computer Science'?'selected':''}>Computer Science</option><option ${u.dept==='Physics'?'selected':''}>Physics</option><option ${u.dept==='Business'?'selected':''}>Business</option><option ${u.dept==='Literature'?'selected':''}>Literature</option><option ${u.dept==='History'?'selected':''}>History</option><option ${u.dept==='Psychology'?'selected':''}>Psychology</option></select></div>

function bindStudent(){
  document.querySelectorAll('.pinp').forEach(i=>i.className=i.className+' mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm');
  document.querySelectorAll('[data-bookdetail]').forEach(b=>b.onclick=()=>bookDetailModal(b.dataset.bookdetail));
  // explore
  const es=document.getElementById('exploreSearch'); if(es){es.oninput=()=>{exploreQ=es.value; document.getElementById('main').innerHTML=studentExplore(); bindStudent(); const ns=document.getElementById('exploreSearch'); ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length);};}
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{exploreFilter=b.dataset.filter; document.getElementById('main').innerHTML=studentExplore(); bindStudent();});
  // borrowed
  document.querySelectorAll('[data-renewreq]').forEach(b=>b.onclick=()=>{const i=DB.issues.find(x=>x.id===b.dataset.renewreq); i.renewRequested=true;
    DB.users.filter(u=>u.role==='admin').forEach(a=>notify(a.id,'renew',`Renewal request for “${book(i.bookId)?.title}”.`));
    saveDB(); toast('Renewal requested'); render();});
  const dl=document.getElementById('dlHistory'); if(dl) dl.onclick=()=>downloadHistory();
  // reservations
  document.querySelectorAll('[data-cancelres]').forEach(b=>b.onclick=()=>{const r=DB.reservations.find(x=>x.id===b.dataset.cancelres); r.status='Cancelled'; saveDB(); toast('Reservation cancelled'); render();});
  // chat
  const scf=document.getElementById('stuChatForm'); if(scf) scf.onsubmit=e=>{e.preventDefault(); sendStudentMsg(e.target.text.value);};
  document.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>sendStudentMsg(b.dataset.suggest));
  // profile
  const pf=document.getElementById('profileForm'); if(pf) pf.onsubmit=e=>{e.preventDefault(); const f=new FormData(pf); const u=user(getSession().id);
    u.name=f.get('name'); u.email=f.get('email'); u.phone=f.get('phone'); u.dept=f.get('dept'); if(f.get('pass')) u.pass=hash(f.get('pass'));
    saveDB(); toast('Profile updated'); render();};
  scrollChat();
}

function sendStudentMsg(text){
  text=(text||'').trim(); if(!text) return;
  const s=getSession();
  let conv=DB.conversations.find(c=>c.userId===s.id);
  if(!conv){ conv={id:uid('c'),userId:s.id,subject:text.slice(0,40),resolved:false,updated:Date.now()}; DB.conversations.push(conv); }
  DB.messages.push({id:uid('m'),convId:conv.id,from:s.id,text,time:Date.now(),read:false}); conv.updated=Date.now();
  DB.users.filter(u=>u.role==='admin').forEach(a=>notify(a.id,'message',`New message from ${user(s.id).name}.`));
  // FAQ assistant auto-reply
  const ans=faqAnswer(text);
  if(ans){ setTimeout(()=>{ DB.messages.push({id:uid('m'),convId:conv.id,from:'u1',text:'🤖 FAQ Assistant: '+ans,time:Date.now(),read:false}); conv.updated=Date.now(); saveDB(); if(STATE.sub==='ask'){document.getElementById('main').innerHTML=studentChat(); bindStudent(); scrollChat();} },600); }
  saveDB();
  document.getElementById('main').innerHTML=studentChat(); bindStudent(); scrollChat();
}

function downloadHistory(){
  const s=getSession(); const rows=[['Book','Author','Issued','Due','Returned','Status']];
  DB.issues.filter(i=>i.userId===s.id).forEach(i=>{const b=book(i.bookId); rows.push([b?.title,b?.author,fmtDate(i.issueDate),fmtDate(i.dueDate),fmtDate(i.returnDate),i.status]);});
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='borrowing_history.csv'; a.click(); URL.revokeObjectURL(url);
  toast('History downloaded');
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(html){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="fixed inset-0 z-[9998] bg-black/50 flex items-center justify-center p-4" id="modalBg">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in" onclick="event.stopPropagation()">${html}</div></div>`;
  document.getElementById('modalBg').onclick=closeModal;
  document.querySelectorAll('.cancelModal').forEach(b=>b.onclick=closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function confirmModal(title,msg,onYes){
  openModal(`<div class="text-center"><div class="text-4xl mb-3">⚠️</div><h3 class="text-lg font-bold text-navy">${esc(title)}</h3><p class="text-sm text-slate-500 mt-1">${esc(msg)}</p>
  <div class="flex gap-3 mt-5"><button class="cancelModal flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium">Cancel</button>
  <button id="confirmYes" class="flex-1 py-2.5 rounded-xl bg-rose-500 text-white font-medium">Confirm</button></div></div>`);
  document.getElementById('confirmYes').onclick=()=>{closeModal(); onYes();};
}

// Initialize from Supabase before rendering the portal.
(async function boot(){
  try{ await loadSupabaseData(); render(); }
  catch(err){ console.error('Supabase initialization failed:',err); toast('Could not load Supabase data: '+err.message,'error'); render(); }
})();
</script>
